site_name: Onderwijsdata Chat
site_description: Stel vragen over open Nederlandse onderwijsdata via een AI-assistent met toegang tot CBS, RIO, DUO, ROA en UWV.
site_url: https://cedanl.github.io/onderwijsdata-chat/
repo_url: https://github.com/cedanl/onderwijsdata-chat
repo_name: cedanl/onderwijsdata-chat
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: nl
  logo: assets/logos/npuls_logo.jpg
  favicon: assets/logos/beeldmerk.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js

nav:
  - Home: index.md
  - Aan de slag: aan-de-slag.md
  - Configuratie:
    - configuratie/index.md
    - Providers & modellen: configuratie/providers.md
  - Databronnen: databronnen.md
  - Domeinregels: domeinregels.md
  - Tools: tools.md
  - Dashboards: dashboards.md
  - API: api.md
  - Routing: routing.md
  - MCP-server: mcp.md
  - EduGenAI-koppeling: edugenai.md
  - Kwaliteit & veiligheid:
    - kwaliteit-en-veiligheid.md
    - Betrouwbaarheid per release: betrouwbaarheid.md
  - Privacy: privacy.md
  - AI-verordening: ai-act.md
  - Architectuur & ontwerp:
    - Anti-hallucinatie: anti-hallucination-architecture.md
    - Architecture Decisions: architecture-decisions.md
    - Reproduceerbare analyses: reproducibility.md
  - Operatie:
    - Operatie & runbook: operatie.md
    - Incidenten en datalekken: incidenten.md
    - Deployment: deployment.md
    - Promoten naar playground: promoten.md
    - Test Environment: test-environment.md
  - Hosting: hosting.md
extra:
  generator: false

copyright: >-
  Centrum Educatieve Data Analyse (CEDA) · Onderdeel van <a href="https://npuls.nl/" target="_blank" rel="noopener">Npuls</a> · <a href="https://edu.nl/twt84" target="_blank" rel="noopener">CEDA-community</a> · <a href="mailto:ceda@surf.nl">ceda@surf.nl</a>

plugins:
  - search:
      lang: nl

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - abbr
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
