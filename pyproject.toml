[project]
name = "onderwijsdata-chat"
version = "1.8.5"
description = "Chat met open Nederlandse onderwijsdata (CBS, RIO en DUO)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "litellm>=1.40",
    "plotly>=5.0",
    "python-dotenv>=1.0",
    "onderwijsdata @ git+https://github.com/cedanl/cbs-onderwijsdata.git",
    "riodata[analyse] @ git+https://github.com/cedanl/rio-onderwijsdata.git",
    "markdown>=3.10.2",
    "openpyxl>=3.1.5",
    "nh3>=0.3.6",
    "piper-tts>=1.4.2",
    "imageio-ffmpeg>=0.6.0",
]

[project.optional-dependencies]
# PostgreSQL is only used by the GitLab SDP deployment. Local and Azure run on
# SQLite, so psycopg2 stays opt-in — install with `uv sync --extra postgres`.
postgres = ["psycopg2-binary>=2.9"]

[dependency-groups]
dev = [
    "watchfiles>=0.21",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.15.16",
    "ty>=0.0.48",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = false
cache-dir = ".uv_cache"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "PERF", "LOG", "RUF", "C4", "FURB"]
ignore = [
    "E402",     # module import not at top — conditional imports (e.g. ollama patch) are intentional
    "RUF001",   # ambiguous unicode — Dutch text uses curly quotes and special chars intentionally
    "RUF003",   # ambiguous unicode in comments — same reason
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PERF102"]
"playground/**" = ["ALL"]

[tool.ty.rules]
invalid-argument-type = "warn"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
