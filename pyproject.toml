[project]
name = "onderwijsdata-chat"
version = "2.5.0"
description = "Chat met open Nederlandse onderwijsdata (CBS, RIO en DUO)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "litellm>=1.40",
    "plotly>=5.0",
    "python-dotenv>=1.0",
    "onderwijsdata @ git+https://github.com/cedanl/cbs-onderwijsdata.git@v0.2.2",
    "riodata[analyse] @ git+https://github.com/cedanl/rio-onderwijsdata.git@9931ce3fc61a9f9133a068319d951bb383f12208",
    "markdown>=3.10.2",
    "openpyxl>=3.1.5",
    "authlib>=1.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
# PostgreSQL is only used by the GitLab SDP deployment. Local and Azure run on
# SQLite, so psycopg2 stays opt-in — install with `uv sync --extra postgres`.
postgres = ["psycopg2-binary>=2.9"]
# MCP-server voor de catalogus (mcp_server.py, #41): alleen nodig wie de catalogus vanuit een
# MCP-client gebruikt, niet voor de chat zelf — install met `uv sync --extra mcp`.
mcp = ["mcp>=2.3"]

[dependency-groups]
dev = [
    "watchfiles>=0.21",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "ruff>=0.15.16",
    "ty>=0.0.48",
]
# Alleen voor demo/narrate.py (TTS-narratie van de demo-video): piper-tts trekt
# onnxruntime mee (~185 MB) — niet in elke venv of de productie-image.
demo = [
    "piper-tts>=1.4.2",
    "imageio-ffmpeg>=0.6.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Dekking (#684, #691): de CI-job toont het totaal en pytest-cov faalt eronder. De stand op main was 94,3% (23-10-2026,
# 12515 statements, 718 gemist); de drempel gaat alleen omhoog, nooit omlaag om een MR groen te krijgen.
[tool.coverage.run]
source = ["."]
omit = ["tests/*", "demo/*", "scripts/*", ".venv/*", "frontend/*"]

[tool.coverage.report]
skip_empty = true
fail_under = 94

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "PERF", "LOG", "RUF", "C4", "FURB"]
ignore = [
    "E402",     # module import not at top — conditional imports (e.g. ollama patch) are intentional
    "RUF001",   # ambiguous unicode — Dutch text uses curly quotes and special chars intentionally
    "RUF003",   # ambiguous unicode in comments — same reason
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PERF102"]

[tool.ty.rules]
invalid-argument-type = "warn"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
