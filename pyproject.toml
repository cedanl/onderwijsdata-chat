[project]
name = "onderwijsdata-chat"
version = "2.5.3"
description = "Chat met open Nederlandse onderwijsdata (CBS, RIO en DUO)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # litellm importeert sinds 1.106 `mcp` zodra een aanroep tools meegeeft (responses/mcp in main.completion). Daarom
    # is `mcp` een gewone dependency en geen extra meer (#938): het runtime-image heeft hem altijd, en `/mcp` in de app
    # (#706) heeft hem ook nodig. tests/test_litellm_mcp.py bewaakt dat, en dat de chattools niet via de MCP-gateway
    # van litellm gaan. Eén minor tegelijk, zoals Renovate hem voorstelt.
    "litellm>=1.108,<1.109",
    "mcp>=2.3",
    "plotly>=5.0",
    "python-dotenv>=1.0",
    # De bronpakketten staan in deze repo, onder packages/ (workspace-leden, zie [tool.uv.workspace]).
    "onderwijsdata",
    "riodata[analyse]",
    "markdown>=3.10.2",
    "openpyxl>=3.1.5",
    "authlib>=1.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
# PostgreSQL is voor een deploy met POSTGRES_URI, zoals de SDP-omgevingen. Lokaal draait de app
# zonder POSTGRES_URI op SQLite, dus psycopg2 blijft opt-in — install met `uv sync --extra postgres`.
postgres = ["psycopg2-binary>=2.9"]

[dependency-groups]
dev = [
    "watchfiles>=0.21",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "ruff>=0.15.16",
    "ty>=0.0.48",
]
# Alleen voor demo/narrate.py (TTS-narratie van de demo-video): piper-tts trekt
# onnxruntime mee (~185 MB) — niet in elke venv of de productie-image.
demo = [
    "piper-tts>=1.4.2",
    "imageio-ffmpeg>=0.6.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.0",
]

[tool.uv]
package = false

# De bronpakketten onderwijsdata en riodata zijn aparte pakketten met een eigen pyproject.toml en eigen tests (#883),
# maar delen met de chat één uv.lock en één venv: wat de chat ervan installeert, komt uit dezelfde commit.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
onderwijsdata = { workspace = true }
riodata = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Live-tests praten met het echte model en de bronnen; `pytest tests/` (ook in CI) draait zonder netwerk (#766, #831).
# Draai ze expliciet met `-m live`: een latere -m op de opdrachtregel gaat voor deze.
addopts = ["-m", "not live"]
markers = ["live: roept het echte model en live bronnen aan; alleen met -m live"]

# Dekking (#684, #691): de CI-job toont het totaal en pytest-cov faalt eronder. De stand op main was 94,3% (23-10-2026,
# 12515 statements, 718 gemist); de drempel gaat alleen omhoog, nooit omlaag om een MR groen te krijgen.
[tool.coverage.run]
source = ["."]
# packages/*: de pakketten hebben eigen tests, die in CI vóór de chattests draaien met hun eigen dekking in het log (#886);
# hun regels tellen niet mee in `fail_under` van de chat.
omit = ["tests/*", "demo/*", "scripts/*", ".venv/*", "frontend/*", "packages/*"]

[tool.coverage.report]
skip_empty = true
fail_under = 94

[tool.ruff]
line-length = 120
# Bewust uitgesloten (besluit bij #886): de pakketten kregen als losse repo's nooit ruff, en opnemen geeft 248 bevindingen
# plus 93 bestanden die ruff anders zou opmaken, een opmaakcommit die de git blame van de pakketten overschrijft. Opruimen
# kan per pakket in een eigen MR; haal het pakket dan hier en uit [tool.ty.src] weg (CONTRIBUTING.md).
extend-exclude = ["packages"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "PERF", "LOG", "RUF", "C4", "FURB"]
ignore = [
    "E402",     # module import not at top — conditional imports (e.g. ollama patch) are intentional
    "RUF001",   # ambiguous unicode — Dutch text uses curly quotes and special chars intentionally
    "RUF003",   # ambiguous unicode in comments — same reason
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PERF102"]

[tool.ty.rules]
invalid-argument-type = "warn"

# Bewust uitgesloten, zelfde besluit als bij ruff: de pakketten hadden als losse repo's geen typecontrole. Hun 93
# diagnostics zouden ty-baseline.txt (nu 78) boven het plafond van het afbouwplan tillen (≤100 eind 2026, #391). De chat
# blijft tegen de geïnstalleerde pakketten typechecken.
[tool.ty.src]
exclude = ["packages"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
