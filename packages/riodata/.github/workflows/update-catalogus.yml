name: Update catalogus site

on:
  push:
    branches: [main]
    paths:
      - data/02-prepared/rio_resources_ai.json
      - src/riodata/data/rio_resources_ai.json
      - src/riodata/data/rio_resources_enriched.json
      - src/riodata/data/duo_resources.json
      - src/riodata/data/duo_resources_enriched.json
      - src/riodata/_catalog.py
      - src/riodata/__init__.py
      - src/riodata/data/roa_resources.json
      - src/riodata/data/uwv_resources.json
      - voorbeelden/manifest.json
      - voorbeelden/output/**

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Exporteer RIO- en DUO-catalogus uit het package
        run: |
          pip install .
          python catalogus/exporteer_site.py

      - name: Kopieer resources naar docs/
        run: |
          cp src/riodata/data/roa_resources.json docs/roa_data.json
          cp src/riodata/data/uwv_resources.json docs/uwv_data.json

      - name: Kopieer en flatten voorbeelden naar docs/voorbeelden/
        run: |
          mkdir -p docs/voorbeelden

          # Kopieer manifest
          cp voorbeelden/manifest.json docs/voorbeelden.json

          # Kopieer alle plots (flatten subdirectories)
          find voorbeelden/output -name "*.png" -exec cp {} docs/voorbeelden/ \;

          # Kopieer INTERPRETATIE.md bestanden — flatten subdir-namen
          find voorbeelden/output -name "*INTERPRETATIE.md" | while read f; do
            filename=$(basename "$f")
            dir=$(basename "$(dirname "$f")")
            if [ "$filename" = "INTERPRETATIE.md" ]; then
              cp "$f" "docs/voorbeelden/${dir}_INTERPRETATIE.md"
            else
              cp "$f" "docs/voorbeelden/$filename"
            fi
          done

      - name: Commit docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || (git commit -m "chore: update catalogus site" && git push)
