openapi: 3.0.0
info:
  title: RIO LOD API
  description: De RIO API is een RESTful webservice conform het HATEOAS principe die
    applicaties in staat stelt om gegevens uit Registratie Instellingen en Opleidingen
    (RIO) op te halen. Deze REST API volgt de Nederlandse API strategie. De data wordt
    dagelijks bijgewerkt om 05.30 uur.
  version: 3.0.0
servers:
- url: "https://lod.onderwijsregistratie.nl/api/rio/v3"
  description: Productie server (gebruikt live data)
x-tagGroups:
- name: Resources
  tags:
  - Opleidingsfasen
  - Opleidingsgroepen
  - Opleidingsonderdelen
  - Opleidingen
  - AangebodenOpleidingen
  - Onderwijslocatiegebruiken
  - Onderwijslocaties
  - OrganisatorischeEenheden
  - Opleidingserkenningen
  - Examenlicenties
  - Onderwijslicenties
  - Erkenningen
paths:
  /aangeboden-opleidingen:
    get:
      tags:
      - AangebodenOpleidingen
      operationId: AangebodenOpleidingen
      parameters:
      - name: type
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/Aangebodenopleidingtype"
      - name: onderwijslocatieId
        in: query
        required: false
        schema:
          maxLength: 7
          minLength: 7
          pattern: "(\\d{3}X\\d{3})"
          type: string
          description: Een betekenisloze identifier voor een onderwijslocatie in de
            Registratie Instellingen en Opleidingen.
      - name: datumGeldigOp
        in: query
        required: false
        schema:
          type: string
          description: De datum die het begin van de periode aangeeft (inclusief).
          format: date
      - name: page
        in: query
        required: false
        schema:
          maximum: 999999
          minimum: 0
          type: integer
          description: De bij de webservice opgevraagde resultatenpagina met een vooraf
            afgesproken aantal resultaten van de betreffende raadpleging
          format: int32
      - name: pageSize
        in: query
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
          description: Het maximaal aantal resultaten dat getoond kan worden op een
            pagina.
          format: int32
      - name: opleidingseenheidcode
        in: query
        required: false
        schema:
          maxLength: 9
          minLength: 9
          pattern: "(\\d{4}O\\d{4})"
          type: string
          description: Een betekenisloze identifier voor een opleidingseenheid in
            de Registratie Instellingen en Opleidingen.
      - name: organisatorischeEenheidcode
        in: query
        required: false
        schema:
          maxLength: 7
          minLength: 7
          pattern: "\\d{3}[A-Z]{1}\\d{3}"
          type: string
          description: Identificerend kenmerk voor een organisatorische eenheid ten
            behoeve van uitwisseling in de keten.
      - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AangebodenOpleiding"
        "400":
          description: 'Bad request. Je request body bevat geen geldige JSON of de
            query wordt niet ondersteund door de API. '
        "403":
          description: 'Forbidden. Je hebt geen rechten om deze URL te benaderen. '
        "406":
          description: 'Not Acceptable. Je hebt waarschijnlijk een gewenst formaat
            met de Accept header verstuurd welke niet ondersteund wordt. '
        "503":
          description: Service Unavailable. Er vindt mogelijk (gepland) onderhoud
            of een storing plaats.
      x-spring-paginated: "true"
      x-lod-paginated: "true"
  /aangeboden-opleidingen/{id}:
    get:
      tags:
      - AangebodenOpleidingen
      operationId: AangebodenOpleiding
      parameters:
      - $ref: "#/components/parameters/Id"
      - name: datumGeldigOp
        in: query
        required: false
        schema:
          type: string
          description: De datum die het begin van de periode aangeeft (inclusief).
