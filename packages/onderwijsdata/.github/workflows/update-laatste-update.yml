name: Update _laatste_update catalogus

# Eén keten: broncontrole → afleiding → TableInfos/perioden → validatie → publicatie
# (package, site, manifest) → tests → commit. Faalt een stap, dan wordt niets
# gecommit en blijft het laatst-goede artefact staan.
on:
  schedule:
    - cron: "0 6 * * 0" # elke zondag 06:00 UTC
  workflow_dispatch:

concurrency:
  group: catalogus-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Check en update _laatste_update
        run: uv run python scripts/update_laatste_update.py

      # Alleen records met gewijzigd schema, nieuwe periode/_laatste_update of
      # verouderde afleiding worden opnieuw afgeleid; de bronlaag volgt altijd.
      - name: Verrijk afgeleide laag (enriched)
        run: uv run python catalogus/verrijk_catalogus.py

      - name: Ververs TableInfos-methodiek en perioden
        run: uv run python catalogus/verrijk_tableinfo.py

      - name: Valideer en publiceer artefact (package, site, manifest)
        run: uv run python catalogus/bouw_artefact.py

      - name: Tests op het nieuwe artefact
        run: uv run pytest -q

      - name: Commit en push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/02-prepared/ src/onderwijsdata/data/ docs/data.json docs/catalogus_manifest.json
          git diff --staged --quiet || (
            GEWIJZIGD=$(git diff --cached data/02-prepared/cbs_datasets_ai.json | grep '^+.*_laatste_update' | wc -l | tr -d ' ')
            git commit -m "chore: update _laatste_update (${GEWIJZIGD} datasets) [$(date +%Y-%m-%d)]"
            git pull --rebase
            git push
          )
