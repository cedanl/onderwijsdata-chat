name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Valideer catalogusartefact
        run: uv run python catalogus/bouw_artefact.py --check
      - name: Tests (incl. wheel/sdist en schone installatie)
        run: uv run pytest -q
