[project]
name = "onderwijsbronnen"
# Gaat verder waar riodata (0.7.0) en onderwijsdata (0.2.2) ophielden: een versievergelijking loopt nooit terug.
version = "0.11.0"
description = "Python client voor open Nederlandse onderwijs- en arbeidsmarktdata: CBS, DUO, RIO, ROA, UWV, Inspectie, SBB, UNL en de Studiekeuzedatabase"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "cedanl", email = "info@cedanl.nl" }]
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1",
    "httpx",
]

[project.optional-dependencies]
analyse = [
    "pandas",
    "matplotlib",
    "openpyxl>=3.1.5",
]
catalogus = ["anthropic>=0.87.0", "pyyaml"]
sbb = [
    "openpyxl>=3.1.5",
]
duo = [
    "openpyxl>=3.1.5",
]

[project.urls]
Homepage = "https://cedanl.github.io/onderwijsdata-chat/catalogus/rio/"
Catalogus-CBS = "https://cedanl.github.io/onderwijsdata-chat/catalogus/cbs/"
Repository = "https://github.com/cedanl/onderwijsdata-chat"

[tool.hatch.build.targets.wheel]
# Alleen onderwijsbronnen; de overgangsnamen riodata en onderwijsdata (#910) zijn weg sinds #914 (0.9.0).
packages = ["src/onderwijsbronnen"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pandas",
    "pytest>=9.1.1",
    "openpyxl>=3.1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]  # verken/ zijn scripts, geen tests
markers = ["echt_schema: test gebruikt het gevalideerde ROA-schema (checksum, kolommen) in plaats van een nep-CSV"]
