# Domeinregels voor DUO-data (#363)
#
# Regels die de tools afdwingen, elk met zijn bron. Een regel toevoegen of wijzigen is een bewerking
# van dit bestand, geen Python: core/domeinregels.py laadt en controleert het, en de tests in
# tests/test_domeinregels.py lopen over elke regel. Uitleg per veld: docs/domeinregels.md.
#
# Elke regel heeft:
#   id             uniek in dit bestand
#   bron           waar de regel vandaan komt: documentatie, URL of de passage uit de data
#   gecontroleerd  de datum waarop de regel tegen die bron is nagegaan, zonder aanhalingstekens
#
# Teksten die de tools doorgeven (definitie, melding, betekenis, vragen) staan op één regel tussen
# "…". Een bron mag over meer regels lopen, tussen """…""".
#
# Een ongeldig bestand laadt niet en de app start dan niet: er is geen stille terugval.


# --- Onderdrukte cellen ---------------------------------------------------------------------------

[sentinel]
id = "duo-onderdrukte-cel"
# Celwaarden die geen telwaarde zijn maar een onderdrukte cel. De app maakt ze leeg en meldt ze.
waarden = [-1]
# Wat -1 betekent, in de woorden die tool-output en snippets delen (#244).
betekenis = "onderdrukte cel: DUO publiceert kleine aantallen niet, geen telwaarde"
# Kolommen waarin -1 een geldige meetwaarde kan zijn in plaats van een onderdrukte cel: een kolom
# waarvan de naam (in hoofdletters) een van deze delen bevat, blijft ongemaskeerd. Niet beperken tot
# AANTAL*-kolommen: DUO kent pivot-datasets waarin de telling in de kolomnaam zit (DIPMAN2023,
# JAAR_2022 — zie prompts/system.md), en die zouden dan ongemaskeerd blijven.
uitgezonderd_als_kolom_bevat = ["MUTATIE", "SALDO", "VERSCHIL", "GROEI", "DELTA"]
bron = """
DUO-datasetbeschrijving van o.a. mbo-studenten-per-instelling, instromende-mbo-studenten en
gediplomeerde-mbo-studenten (riodata-catalogus): "In het kader van statistische beveiliging zijn alle
cellen met kleine aantallen (1, 2, 3, of 4) zijn vervangen door ‘-1’." Toen alleen de store maskeerde,
toonde het dashboard -1 studenten (#228) en gaf de snippet andere getallen dan de app (#227).
De uitgezonderde kolommen zijn een keuze van de chat, geen DUO-tekst: in een mutatie, saldo of groei
kan -1 een echte waarde zijn.
"""
gecontroleerd = 2026-10-14


# --- Opleidingsvorm in het hoger onderwijs --------------------------------------------------------

[opleidingsvorm]
id = "ho-opleidingsvorm-codes"
# Alleen deze bestanden noemen de codes; elders betekent OPLEIDINGSVORM iets anders (#371).
datasets = ["p01hoinges", "p02ho1ejrs", "p03hoinschr", "p04hogdipl"]
codes = { VT = "voltijd", DT = "deeltijd", DU = "duaal" }
bron = """
DUO-datasetbeschrijving van p01hoinges, p02ho1ejrs, p03hoinschr en p04hogdipl (riodata-catalogus):
"De betekenis van de waarden in het attribuut OPLEIDINGSVORM is VT voltijd onderwijs, DT deeltijd
onderwijs en DU duaal onderwijs." mbo_opleidingsaanbod gebruikt bijv. KLASSIKAAL (#371). Zonder
definitie raadde een model 'DT = duaal-tijd' (#172).
"""
gecontroleerd = 2026-10-14


