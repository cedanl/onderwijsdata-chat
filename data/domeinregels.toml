# Catalogusvraag = herschreven vraag. Herschreven, niet weggelaten: de vraag draagt ook de treffer op
# 'ingeschrevenen' (gouden set, tests/test_catalog_gouden_set.py).
[herkomst_is_vestiging.voorbeeldvragen]
"In welke provincie wonen de meeste ingeschrevenen?" = "In welke provincie liggen de vestigingen met de meeste ingeschrevenen?"
"In welke provincie wonen de meeste eerstejaars ingeschrevenen?" = "In welke provincie liggen de vestigingen met de meeste eerstejaars ingeschrevenen?"
