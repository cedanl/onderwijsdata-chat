# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - onderwijsdata-chat

on:
  push:
    tags:
      # Major releases only (X.0.0) — GitLab's SDP pipeline auto-tags every
      # patch/minor bump on main and only mirrors major tags to GitHub.
      - '[0-9]*.0.0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Python-versie uit .python-version, net als in de GitLab-pipeline.
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # Dezelfde poorten als de pytest-job in .gitlab-ci.yml (#230).
      - name: Lint, format en typecheck (backend)
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run python scripts/ty_baseline.py

      - name: Run Python tests
        run: uv run pytest tests/ -q

      - name: Install production dependencies
        run: |
          uv export --no-dev --no-hashes -o requirements.txt
          uv pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Scan Python dependencies for vulnerabilities
        run: uv run pip-audit || true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Scan npm dependencies for vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high || true

      - name: Build and test React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-app
          path: |
            .
            !.git
            !tests

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        id: deploy-to-webapp
        with:
          app-name: 'onderwijsdata-chat'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_63DF31C884EF443FBED13EA7A8E366C4 }}
