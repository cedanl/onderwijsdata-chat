name: Sync to GitLab

on:
  push:
    tags:
      - 'v*'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_REPO: git@git.ia.surf.nl:surf-internal/npuls/ceda/onderwijsdata-chat.git
          GITLAB_SSH_KEY: ${{ secrets.GITLAB_SSH_KEY }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$GITLAB_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa git.ia.surf.nl >> ~/.ssh/known_hosts 2>/dev/null

          # Add GitLab as remote
          git remote add gitlab "$GITLAB_REPO" || true

          # Push all branches and tags
          git push gitlab main
          git push gitlab --tags

      - name: Trigger GitLab CI
        env:
          GITLAB_HOST: git.ia.surf.nl
          GITLAB_PROJECT_ID: "surf-internal/npuls/ceda/onderwijsdata-chat"
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Get project ID
          PROJ_ID=$(curl -s -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "https://$GITLAB_HOST/api/v4/projects?search=onderwijsdata-chat" \
            | jq -r '.[0].id')

          # Trigger pipeline on tag
          curl -s -X POST \
            -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "https://$GITLAB_HOST/api/v4/projects/$PROJ_ID/pipeline" \
            -d "ref=$TAG" || true

          echo "GitLab CI pipeline triggered for tag: $TAG"
