name: UX-audit (Playwright)

# Draait de gebruikerservaringsaudit uit audit/run-audit.mjs tegen een echte
# omgeving. Alleen op de audit-branch: dit is geen onderdeel van de CI voor main.
#
# Secrets (gh secret set): AUDIT_BASE_URL, AUDIT_USER, AUDIT_PASS
#
# De resultaten gaan als commit terug naar deze branch (niet als artifact):
# wie de audit vanaf een beperkte netwerk-uitgang draait, kan artifacts en
# logs niet ophalen, maar git wel lezen.
#
# Handmatig opnieuw: gh run rerun <run-id>  (of een wijziging in audit/ pushen)

on:
  push:
    branches:
      - arena/01a101f4-onderwijsdata-chat
    paths:
      - 'audit/**'
      - '.github/workflows/ux-audit.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Te auditen omgeving'
        required: false
        default: 'https://onderwijsdata-chat.test.sdp.surf.nl'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installeer Playwright
        working-directory: audit
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Controleer of er inloggegevens zijn
        id: creds
        env:
          AUDIT_USER: ${{ secrets.AUDIT_USER }}
          AUDIT_PASS: ${{ secrets.AUDIT_PASS }}
        run: |
          if [ -z "$AUDIT_USER" ] || [ -z "$AUDIT_PASS" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets AUDIT_USER / AUDIT_PASS ontbreken — de audit draait zonder login."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Draai de audit
        working-directory: audit
        env:
          AUDIT_BASE_URL: ${{ inputs.base_url || secrets.AUDIT_BASE_URL || 'https://onderwijsdata-chat.test.sdp.surf.nl' }}
          AUDIT_USER: ${{ secrets.AUDIT_USER }}
          AUDIT_PASS: ${{ secrets.AUDIT_PASS }}
          AUDIT_OUT: ${{ runner.temp }}/audit-out
        run: node run-audit.mjs 2>&1 | tee audit-log.txt

      - name: Publiceer resultaten op de branch
        if: always()
        env:
          AUDIT_OUT: ${{ runner.temp }}/audit-out
        run: |
          set -e
          BRANCH="${GITHUB_REF_NAME}"
          mkdir -p audit/out
          cp -r "$AUDIT_OUT"/. audit/out/ 2>/dev/null || true
          cp audit/audit-log.txt audit/out/audit-log.txt 2>/dev/null || true
          # trace.zip en network.har kunnen tientallen MB's zijn: alleen meenemen als ze klein genoeg zijn.
          for big in audit/out/trace.zip audit/out/network.har; do
            if [ -f "$big" ] && [ "$(stat -c%s "$big")" -gt 20000000 ]; then
              echo "te groot, overgeslagen: $big ($(stat -c%s "$big") bytes)"
              rm -f "$big"
            fi
          done
          node -e "
            const fs=require('fs');
            const r=JSON.parse(fs.readFileSync('audit/out/report.json','utf8'));
            const l=[];
            l.push('# UX-audit '+new Date().toISOString());
            l.push('');
            l.push('- omgeving: '+r.meta.base);
            l.push('- stappen: '+r.metrics.stepsOk+' ok / '+r.metrics.stepsFout+' fout');
            l.push('- findings: '+r.metrics.findings+' · console-errors: '+r.metrics.consoleErrors);
            l.push('');
            l.push('## Stappen');
            for (const s of r.steps) l.push('- '+(s.status==='ok'?'✅':'❌')+' **'+s.name+'** ('+s.ms+' ms)'+(s.error?' — '+s.error:''));
            l.push('');
            l.push('## Findings');
            for (const f of r.findings) l.push('- **['+f.sev+'] '+f.area+'** — '+f.title+(f.detail?' — '+f.detail:''));
            fs.writeFileSync('audit/out/SAMENVATTING.md', l.join('\n'));
          " || true
          git config user.name "ux-audit[bot]"
          git config user.email "ux-audit@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git checkout -B audit-resultaten FETCH_HEAD
          git add -f audit/out
          git commit -m "chore(audit): resultaten van run ${GITHUB_RUN_ID}" || echo "niets te committen"
          for i in 1 2 3; do
            if git push origin "HEAD:${BRANCH}"; then break; fi
            git fetch origin "$BRANCH"
            git rebase FETCH_HEAD || git rebase --abort
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-audit-resultaten
          path: audit/out
          retention-days: 14
          if-no-files-found: warn
