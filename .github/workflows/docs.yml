name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # De versieregel van de docs komt uit pyproject.toml (audit G2); de test houdt het bestand in de repo gelijk.
      - name: Versieregel
        run: uv run python scripts/docs_versie.py

      # Zensical staat vastgepind in de docs-groep van pyproject.toml (pre-1.0: bewust verhogen).
      - name: Build docs
        run: uv run --group docs zensical build --strict --clean

      # De catalogussites van de bronpakketten (#887), vroeger op cedanl.github.io/cbs-onderwijsdata en
      # /rio-onderwijsdata. De CI-job catalogus:site in GitLab houdt packages/onderwijsbronnen/docs/{cbs,rio} bij (docs/operatie.md).
      - name: Catalogussites van de bronpakketten
        run: |
          mkdir -p site/catalogus
          cp -r packages/onderwijsbronnen/docs/cbs site/catalogus/cbs
          cp -r packages/onderwijsbronnen/docs/rio site/catalogus/rio

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        if: github.event_name != 'pull_request'

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/

  deploy:
    needs: build
    # Eén Pages-deployment tegelijk. Zonder groep startte een tweede merge een nieuwe deployment terwijl de vorige
    # nog liep; die bleef op `updating_pages` staan tot de time-out (run 41863914966, 04-11). Niet annuleren:
    # de lopende deployment maakt af, de volgende wacht.
    concurrency:
      group: pages
      cancel-in-progress: false
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
