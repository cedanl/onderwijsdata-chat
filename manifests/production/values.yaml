# Eén pod, bewust (ADR-011, besluit 09-11 op #677): de opgehaalde data (tools/store.py), de limieten en de
# SRAM-cache leven in het geheugen van de pod. Met meer pods en zonder sticky sessions komt een CSV-download
# (/api/data/csv) bij een pod die de tabel niet kent, en tellen de limieten per pod. Opschalen is #984; geen HPA.
# Strategie: de standaard RollingUpdate (maxSurge 1, maxUnavailable 0), zodat de oude pod pas stopt als de nieuwe
# klaar is; dat vraagt quotum voor een tweede pod tijdens de uitrol (#674). Past dat niet, dan `strategy: Recreate`
# zoals op test, en is elke uitrol een onderbreking van start plus startupProbe (docs/operatie.md).
replicaCount: 1

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 1Gi

ingress:
  web:
    className: "traefik-external"
    hosts:
      - host: onderwijsdata-chat.sdp.surf.nl
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: "onderwijsdata-chat-tls"
        hosts:
          - onderwijsdata-chat.sdp.surf.nl

env:
  # Omgevingsnaam (#676): JSON-logs op SDP; geen API-documentatie op playground en productie (config.py).
  - name: APP_ENV
    value: "production"
  # Platform-provisioned Postgres for this tenant, same pattern as test/development
  # (manifests/test/values.yaml) — the previous POSTGRES_URI/onderwijsdata-chat-secrets
  # reference here was stale and never matched an actual secret key.
  - name: POSTGRES_URI
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-app
        key: uri
  # CHAT_SECRET is required once AUTH_ENABLED is true (core/auth.py hard-fails at
  # startup otherwise) — signs auth tokens.
  - name: CHAT_SECRET
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-secrets
        key: CHAT_SECRET
  - name: CHAT_USERS
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-secrets
        key: CHAT_USERS
  - name: MODEL
    value: "azure_ai/claude-sonnet-5-5"
  - name: AVAILABLE_MODELS
    value: "azure_ai/claude-sonnet-5-5"
  - name: WILLMA_BASE_URL
    value: "https://willma.surf.nl/api/v0"
  - name: WILLMA_API_KEY
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-secrets
        key: WILLMA_API_KEY
  # Azure AI Foundry — default + picker draaien hierop.
  # AZURE_AI_API_KEY + AZURE_AI_API_BASE moeten in onderwijsdata-chat-secrets staan.
  - name: AZURE_AI_API_KEY
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-secrets
        key: AZURE_AI_API_KEY
  - name: AZURE_AI_API_BASE
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-secrets
        key: AZURE_AI_API_BASE
  - name: LOG_LEVEL
    value: "INFO"
  - name: CORS_ORIGINS
    value: "https://onderwijsdata-chat.sdp.surf.nl"
  # Dashboards staan op production uit; op test en playground aan (vlag uit 47e7727f).
  - name: ENABLE_DASHBOARDS
    value: "false"
