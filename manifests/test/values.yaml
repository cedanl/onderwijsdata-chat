ingress:
  web:
    className: "traefik-external"
    hosts:
      - host: onderwijsdata-chat.test.sdp.surf.nl
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: "onderwijsdata-chat-tls"
        hosts:
          - onderwijsdata-chat.test.sdp.surf.nl

# ResourceQuota on this tenant caps limits.cpu at 1 (1000m) -- exactly one
# pod's worth. A RollingUpdate briefly surges to 2 pods even at
# replicaCount: 1 (default maxSurge: 25% rounds up to 1 extra), which can
# never fit and deadlocks the rollout (old pod holds the quota, new pod
# can't get scheduled, old pod won't terminate until new pod is ready).
# Recreate avoids ever needing 2x the resource footprint at once (#537).
# Zelfde als playground.
strategy:
  type: Recreate

# Het kindproces van run_analysis mag 1 GiB gebruiken (RLIMIT_AS in tools/sandbox_kind.py). De pod
# moet dat naast de server (~500 MiB in rust) en de datastore (STORE_MAX_MB, 512 MiB) dragen, plus de
# tijdelijke kopieën van pandas tijdens een tool, anders stopt een zwaar script de hele server in
# plaats van alleen het kindproces (#443). Op 2 GiB werd de pod tijdens de testronde van 14-10-2026
# vier keer OOMKilled, met "Verbinding verbroken" in elke open chat (#546); 3 GiB past nog in het
# quotum van de namespace (limits.memory 4Gi, limits.cpu 1, requests.memory 1Gi) met één pod
# (Recreate). Playground staat nog op 2 GiB.
resources:
  limits:
    cpu: 900m
    memory: 3Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Opschoning na de bewaartermijn (#485, charts/onderwijsdata-chat/templates/cronjob-opschonen.yaml): elke nacht,
# tegen de Postgres van POSTGRES_URI hieronder. De CronJob-pod telt mee in het quotum (limits.cpu 1): daarom heeft
# de app hierboven 900m in plaats van 1000m, en de opschoonpod 100m (opschonen.resources in de chart).
opschonen:
  enabled: true

env:
  # Omgevingsnaam (#676): JSON-logs op SDP; geen API-documentatie op playground en productie (config.py).
  - name: APP_ENV
    value: "test"
  # SRAM OIDC — see GH issue #60. These 3 values are public/known and safe to
  # set now; OIDC_CLIENT_ID/OIDC_CLIENT_SECRET (in secret_orig.yaml) are still
  # placeholders pending a real SRAM application registration. This means the
  # "Inloggen met SURF SRAM" login button will appear but fail on click until
  # real credentials are swapped in — accepted tradeoff so activation is a
  # single secret update once SURF responds, not a values.yaml change too.
  - name: OIDC_PROVIDER
    value: "SRAM"
  - name: OIDC_DISCOVERY_URL
    value: "https://proxy.sram.surf.nl/.well-known/openid-configuration"
  - name: SERVER_URL
    value: "https://onderwijsdata-chat.test.sdp.surf.nl"
  - name: OIDC_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-secrets
        key: OIDC_CLIENT_ID
  - name: OIDC_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-secrets
        key: OIDC_CLIENT_SECRET
  # Required now that AUTH_ENABLED is true (core/auth.py hard-fails at
  # startup otherwise) — signs auth tokens, unrelated to the SRAM client
  # credentials themselves.
  - name: CHAT_SECRET
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-secrets
        key: CHAT_SECRET
  # Password login, coexists with SRAM permanently (not a placeholder to
  # remove later) — see LoginPage.jsx, both options render together.
  - name: CHAT_USERS
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-secrets
        key: CHAT_USERS
  # Platform-provisioned Postgres for this tenant (services-onderwijsdata-chat-pgdb) —
  # secret already existed, just never wired up. Without this the app silently
  # falls back to SQLite on the pod's own ephemeral filesystem (no PVC in this
  # chart), so chat history is lost on every restart.
  - name: POSTGRES_URI
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-app
        key: uri
  # azure_ai/claude-sonnet-5-5: default — Foundry-modellen zijn het enige
  # aanbod (Willma-model eruit, endpoint blijft als fallback-optie staan).
  # Sonnet 5.5 is het enige model in de picker.
  - name: MODEL
    value: "azure_ai/claude-sonnet-5-5"
  - name: WILLMA_BASE_URL
    value: "https://willma.surf.nl/api/v0"
  - name: WILLMA_API_KEY
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-secrets
        key: WILLMA_API_KEY
  - name: LOG_LEVEL
    value: "INFO"
  - name: CORS_ORIGINS
    value: "https://onderwijsdata-chat.test.sdp.surf.nl"
  # Temporary disable of the dashboards feature (flag added in 47e7727f).
  # Set to "true" (or remove this entry) to re-enable.
  - name: ENABLE_DASHBOARDS
    value: "false"
  # Azure AI Foundry — optioneel naast Willma.
  # AZURE_AI_API_KEY + AZURE_AI_API_BASE moeten in onderwijsdata-chat-secrets staan.
  - name: AZURE_AI_API_KEY
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-secrets
        key: AZURE_AI_API_KEY
  - name: AZURE_AI_API_BASE
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-secrets
        key: AZURE_AI_API_BASE
  # Model-picker toont de Foundry-modellen.
  - name: AVAILABLE_MODELS
    value: "azure_ai/claude-sonnet-5-5"
