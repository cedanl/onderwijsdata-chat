apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - secret.yaml
  - middleware.yaml

configMapGenerator:
  - name: development-config
    files:
      - values.yaml=values.yaml

patches:
  - target:
      kind: HelmRelease
      name: onderwijsdata-chat
    patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: development-config
