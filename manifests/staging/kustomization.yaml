apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

configMapGenerator:
  - name: staging-config
    files:
      - values.yaml=values.yaml

configurations:
  - ../base/kustomizeconfig.yaml

patches:
  - target:
      kind: HelmRelease
      name: onderwijsdata-chat
    patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: staging-config
