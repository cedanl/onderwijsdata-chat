apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - helmrelease.yaml
  - helmrepo.yaml
  - secret.yaml

configMapGenerator:
  - name: base-config
    files:
      - values.yaml=../base/values-base.yaml
  - name: playground-config
    files:
      - values.yaml=values.yaml

configurations:
  - ../base/kustomizeconfig.yaml
