apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - secret.yaml

configMapGenerator:
  - name: playground-config
    files:
      - values.yaml=values.yaml

configurations:
  - ../base/kustomizeconfig.yaml

patches:
  - target:
      kind: HelmRelease
      name: onderwijsdata-chat
    patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: playground-config
  # Strip Traefik middleware annotation (cross-namespace ref breaks in playground Traefik)
  # See: https://github.com/Tomeriko96/glab-surf/issues/59
  - target:
      kind: Ingress
      name: fn-onderwijsdata-chat
    patch: |-
      - op: remove
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
