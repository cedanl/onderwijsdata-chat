replicaCount: 1

# ResourceQuota on this tenant caps limits.cpu at 1 (1000m) -- exactly one
# pod's worth. A RollingUpdate briefly surges to 2 pods even at
# replicaCount: 1 (default maxSurge: 25% rounds up to 1 extra), which can
# never fit and deadlocks the rollout (old pod holds the quota, new pod
# can't get scheduled, old pod won't terminate until new pod is ready).
# Recreate avoids ever needing 2x the resource footprint at once.
strategy:
  type: Recreate

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

ingress:
  web:
    className: "traefik-external"
    annotations:
      cert-manager.io/cluster-issuer: "harica-eab"
      traefik.ingress.kubernetes.io/router.middlewares: null
    hosts:
      - host: onderwijsdata-chat.playground.sdp.surf.nl
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: "onderwijsdata-chat-tls"
        hosts:
          - onderwijsdata-chat.playground.sdp.surf.nl

env:
  # SRAM OIDC — see GH issue #60. These 3 values are public/known and safe to
  # set now; OIDC_CLIENT_ID/OIDC_CLIENT_SECRET (in secret_orig.yaml) are still
  # placeholders pending a real SRAM application registration. This means the
  # "Inloggen met SURF SRAM" login button will appear but fail on click until
  # real credentials are swapped in — accepted tradeoff so activation is a
  # single secret update once SURF responds, not a values.yaml change too.
  - name: OIDC_PROVIDER
    value: "SRAM"
  - name: OIDC_DISCOVERY_URL
    value: "https://proxy.sram.surf.nl/.well-known/openid-configuration"
  - name: SERVER_URL
    value: "https://onderwijsdata-chat.playground.sdp.surf.nl"
  - name: OIDC_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-secrets
        key: OIDC_CLIENT_ID
  - name: OIDC_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-secrets
        key: OIDC_CLIENT_SECRET
  # Required now that AUTH_ENABLED is true (core/auth.py hard-fails at
  # startup otherwise) — signs auth tokens, unrelated to the SRAM client
  # credentials themselves.
  - name: CHAT_SECRET
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-secrets
        key: CHAT_SECRET
  # Password login, coexists with SRAM permanently (not a placeholder to
  # remove later) — see LoginPage.jsx, both options render together.
  - name: CHAT_USERS
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-secrets
        key: CHAT_USERS
  # Platform-provisioned Postgres for this tenant, same pattern as test
  # (manifests/test/values.yaml) — the previous POSTGRES_URI/onderwijsdata-chat-secrets
  # reference here was stale and never matched an actual secret key.
  - name: POSTGRES_URI
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-app
        key: uri
  - name: MODEL
    value: "openai/gpt-oss-120b"
  - name: WILLMA_BASE_URL
    value: "https://willma.surf.nl/api/v0"
  - name: WILLMA_API_KEY
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-secrets
        key: WILLMA_API_KEY
  - name: LOG_LEVEL
    value: "INFO"
  - name: CORS_ORIGINS
    value: "*"
  # Temporary disable of the dashboards feature (flag added in 47e7727f).
  # Set to "true" (or remove this entry) to re-enable.
  - name: ENABLE_DASHBOARDS
    value: "false"
  # Azure AI Foundry — optioneel naast Willma.
  # AZURE_AI_API_KEY + AZURE_AI_API_BASE moeten in onderwijsdata-chat-secrets staan.
  - name: AZURE_AI_API_KEY
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-secrets
        key: AZURE_AI_API_KEY
  - name: AZURE_AI_API_BASE
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-secrets
        key: AZURE_AI_API_BASE
  # Model-picker toont zowel Willma als Azure AI Foundry modellen.
  - name: AVAILABLE_MODELS
    value: "openai/gpt-oss-120b,azure_ai/claude-sonnet-4-6"
