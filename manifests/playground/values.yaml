replicaCount: 1

# ResourceQuota on this tenant caps limits.cpu at 1 (1000m) -- exactly one
# pod's worth. A RollingUpdate briefly surges to 2 pods even at
# replicaCount: 1 (default maxSurge: 25% rounds up to 1 extra), which can
# never fit and deadlocks the rollout (old pod holds the quota, new pod
# can't get scheduled, old pod won't terminate until new pod is ready).
# Recreate avoids ever needing 2x the resource footprint at once.
strategy:
  type: Recreate

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

ingress:
  web:
    className: "traefik-external"
    hosts:
      - host: onderwijsdata-chat.playground.sdp.surf.nl
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: "onderwijsdata-chat-tls"
        hosts:
          - onderwijsdata-chat.playground.sdp.surf.nl

env:
  # Platform-provisioned Postgres for this tenant, same pattern as test
  # (manifests/test/values.yaml) — the previous POSTGRES_URI/onderwijsdata-chat-secrets
  # reference here was stale and never matched an actual secret key.
  - name: POSTGRES_URI
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-app
        key: uri
  # CHAT_SECRET is required once AUTH_ENABLED is true (core/auth.py hard-fails at
  # startup otherwise) — signs auth tokens.
  - name: CHAT_SECRET
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-secrets
        key: CHAT_SECRET
  - name: CHAT_USERS
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-secrets
        key: CHAT_USERS
  - name: MODEL
    value: "openai/gpt-oss-120b"
  - name: WILLMA_BASE_URL
    value: "https://willma.surf.nl/api/v0"
  - name: WILLMA_API_KEY
    valueFrom:
      secretKeyRef:
        name: onderwijsdata-chat-secrets
        key: WILLMA_API_KEY
  - name: LOG_LEVEL
    value: "INFO"
  - name: CORS_ORIGINS
    value: "*"
