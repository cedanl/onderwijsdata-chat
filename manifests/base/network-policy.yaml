apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: onderwijsdata-chat-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: onderwijsdata-chat
  policyTypes:
    - Egress
  egress:
    # DNS (kube-dns)
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53

    # HTTPS outbound to external APIs
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

    # PostgreSQL to RW service in same namespace
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
