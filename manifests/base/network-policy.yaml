apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: onderwijsdata-chat-allow-traefik-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra-traefik-external
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra-traefik-internal
      ports:
        - protocol: TCP
          port: 8000
