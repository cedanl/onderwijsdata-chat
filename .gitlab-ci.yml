workflow:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      variables:
        ENVIRONMENT_CLUSTER: "testing"
        ENVIRONMENT_NAME: "odw-chat-testing"
    - if: $CI_MERGE_REQUEST_IID
      variables:
        ENVIRONMENT_CLUSTER: "testing"
        ENVIRONMENT_NAME: "odw-chat-testing"
    - if: $CI_COMMIT_TAG
      variables:
        ENVIRONMENT_CLUSTER: "staging"
        ENVIRONMENT_NAME: "odw-chat-staging"

include:
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/base/base@0
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/base/security@0
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/semver/generate-version@0
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/semver/promote-version@0
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/docker/docker-lint@0
    inputs:
      name: docker:docker-lint
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/docker/docker-build@0
    inputs:
      name: docker:docker-build
      image: $HARBOR_HOST/$HARBOR_PROJECT/$CI_PROJECT_NAME
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/docker/docker-promote@0
    inputs:
      name: docker:docker-promote
      image: $HARBOR_HOST/$HARBOR_PROJECT/$CI_PROJECT_NAME
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/helm/helm-lint@0
    inputs:
      dir: $CHART_PATH
  - local: .gitlab/helm-package.yaml
    inputs:
      dir: $CHART_PATH
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/helm/helm-publish@0
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/helm/helm-promote@0
    inputs:
      chart: oci://$HARBOR_HOST/$HARBOR_PROJECT/onderwijsdata-chat
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/helm/helm-publish@0
    inputs:
      name: helm:publish-promoted
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/kubernetes/diff@0
    inputs:
      cluster: ${ENVIRONMENT_CLUSTER}
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/kubernetes/dry-run@0
    inputs:
      cluster: ${ENVIRONMENT_CLUSTER}
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/kubernetes/verify-up@0
    inputs:
      cluster: ${ENVIRONMENT_CLUSTER}
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/kubernetes/verify-up@0
    inputs:
      name: kubernetes:verify-up:tag
      chart_version: $CI_COMMIT_TAG
      cluster: ${ENVIRONMENT_CLUSTER}
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/kubernetes/failure@0
    inputs:
      cluster: ${ENVIRONMENT_CLUSTER}

variables:
  CHART_PATH: $CI_PROJECT_DIR/charts/onderwijsdata-chat
  CI_PROJECT_NAME: onderwijsdata-chat

stages:
  - build
  - test
  - package
  - pre-deploy
  - release
  - post-deploy

version:generate:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID

version:promote:
  rules:
    - if: $CI_COMMIT_TAG

docker:docker-build:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
  needs:
    - version:generate

docker:docker-build:container_scanning:
  rules:
    - when: never

docker:docker-promote:
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - version:promote

docker:docker-lint:
  rules:
    - when: never

helm:lint:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID

helm:package:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID

helm:publish:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID

helm:promote:
  rules:
    - if: $CI_COMMIT_TAG

helm:publish-promoted:
  rules:
    - if: $CI_COMMIT_TAG

kubernetes:diff:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
  needs:
    - job: helm:promote
      optional: true

kubernetes:dry-run:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID

kubernetes:patch-ingress-api:
  stage: pre-deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
  script:
    - apk add --no-cache curl jq
    - |
      echo "Patching ingress via Kubernetes API..."
      curl -k -X PATCH \
        -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null || echo '')" \
        -H "Content-Type: application/merge-patch+json" \
        --data '{"spec":{"ingressClassName":"traefik-external"}}' \
        https://kubernetes.default.svc:443/apis/networking.k8s.io/v1/namespaces/services-onderwijsdata-chat/ingresses/fn-onderwijsdata-chat \
        2>&1 || echo "Patch via API may have failed, will try kubectl in verify-up"
  allow_failure: true

kubernetes:verify-up:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
  needs:
    - job: kubernetes:patch-ingress-api
      optional: true

kubernetes:verify-up:tag:
  rules:
    - if: $CI_COMMIT_TAG

debug:logs:
  stage: .post
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  environment:
    name: $ENVIRONMENT_NAME
    action: access
  variables:
    KUBERNETES_NAMESPACE: services-onderwijsdata-chat
    CLUSTER: $ENVIRONMENT_CLUSTER
  image: cr.surf.nl/proxy-quay/helmpack/chart-testing:v3.14.0
  script:
    - kubectl config use-context surf-internal/sdp/infrastructure/kubernetes-clusters:${CLUSTER}
    - kubectl get pods -n ${KUBERNETES_NAMESPACE}
