workflow:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      variables:
        ENVIRONMENT_CLUSTER: "testing"
        ENVIRONMENT_NAME: "odw-chat-testing"
    - if: $CI_MERGE_REQUEST_IID
      variables:
        ENVIRONMENT_CLUSTER: "development"
        ENVIRONMENT_NAME: "odw-chat-development"
    - if: $CI_COMMIT_TAG
      variables:
        ENVIRONMENT_CLUSTER: "playground"
        ENVIRONMENT_NAME: "odw-chat-playground"

include:
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/base/base@0.10.8
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/base/security@0.10.8
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/semver/generate-version@1.0.2
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/semver/promote-version@1.0.2
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/docker/docker-lint@1.0.11
    inputs:
      name: docker:docker-lint
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/docker/docker-build@1.0.11
    inputs:
      name: docker:docker-build
      image: $HARBOR_HOST/$HARBOR_PROJECT/$CI_PROJECT_NAME
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/docker/docker-promote@1.0.11
    inputs:
      name: docker:docker-promote
      image: $HARBOR_HOST/$HARBOR_PROJECT/$CI_PROJECT_NAME
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/helm/helm-lint@0.9.13
    inputs:
      dir: $CHART_PATH
  - local: .gitlab/helm-package.yaml
    inputs:
      dir: $CHART_PATH
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/helm/helm-publish@0.9.13
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/helm/helm-promote@0.9.13
    inputs:
      chart: oci://$HARBOR_HOST/$HARBOR_PROJECT/onderwijsdata-chat
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/helm/helm-publish@0.9.13
    inputs:
      name: helm:publish-promoted
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/kubernetes/diff@1.0.2
    inputs:
      cluster: ${ENVIRONMENT_CLUSTER}
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/kubernetes/dry-run@1.0.2
    inputs:
      cluster: ${ENVIRONMENT_CLUSTER}
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/kubernetes/verify-up@1.0.2
    inputs:
      cluster: ${ENVIRONMENT_CLUSTER}
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/kubernetes/verify-up@1.0.2
    inputs:
      name: kubernetes:verify-up:tag
      chart_version: $CI_COMMIT_TAG
      cluster: ${ENVIRONMENT_CLUSTER}
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/kubernetes/failure@1.0.2
    inputs:
      cluster: ${ENVIRONMENT_CLUSTER}

variables:
  CHART_PATH: $CI_PROJECT_DIR/charts/onderwijsdata-chat
  CI_PROJECT_NAME: onderwijsdata-chat

stages:
  - build
  - test
  - package
  - pre-deploy
  - release
  - post-deploy

version:generate:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID

version:promote:
  rules:
    - if: $CI_COMMIT_TAG

docker:docker-build:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
  needs:
    - version:generate

docker:docker-promote:
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - version:promote

helm:lint:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID

helm:package:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID

helm:publish:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID

helm:promote:
  rules:
    - if: $CI_COMMIT_TAG

helm:publish-promoted:
  rules:
    - if: $CI_COMMIT_TAG

kubernetes:diff:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
  needs:
    - job: helm:promote
      optional: true

kubernetes:dry-run:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID

kubernetes:verify-up:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

kubernetes:verify-up:tag:
  rules:
    - if: $CI_COMMIT_TAG

debug:logs:
  stage: .post
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  environment:
    name: $ENVIRONMENT_NAME
    action: access
  variables:
    KUBERNETES_NAMESPACE: services-onderwijsdata-chat
    CLUSTER: $ENVIRONMENT_CLUSTER
  image: cr.surf.nl/proxy-quay/helmpack/chart-testing:v3.14.0@sha256:425ff3058dfc192fffb94e471e732b9bc995c375df963eba417ff01aea594e83
  script:
    - kubectl config use-context surf-internal/sdp/infrastructure/kubernetes-clusters:${CLUSTER}
    - kubectl get pods -n ${KUBERNETES_NAMESPACE}

sync:github:
  stage: .post
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_COMMIT_TAG
      when: always
  image:
    name: alpine/git:2.45.2@sha256:16ad8e788e1d3b0c30f18da8dde5c0ace3b187445a62d8af893b003ca1e70592
    entrypoint: [""]
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - git push --force "https://x-access-token:${GITHUB_SYNC_TOKEN}@github.com/cedanl/onderwijsdata-chat.git" HEAD:main
    - |
      case "$CI_COMMIT_TAG" in
        v[0-9]*.0.0)
          echo "Major release tag $CI_COMMIT_TAG — pushing to GitHub"
          git push --force "https://x-access-token:${GITHUB_SYNC_TOKEN}@github.com/cedanl/onderwijsdata-chat.git" "refs/tags/$CI_COMMIT_TAG"
          ;;
        *)
          echo "No tag, or not a major release tag (want vX.0.0) — skipping GitHub tag push"
          ;;
      esac
