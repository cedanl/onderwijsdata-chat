workflow:
  # A newer commit on the same ref cancels jobs marked interruptible in older
  # pipelines, so superseded deploys do not fail verify-up (see #132).
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Markers (env/playground/<versie>) zijn een record van een promotie en
    # starten geen pipeline (docs/promoten.md).
    - if: $CI_COMMIT_TAG =~ /^env\//
      when: never
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      variables:
        ENVIRONMENT_CLUSTER: "testing"
        ENVIRONMENT_NAME: "odw-chat-testing"
    - if: $CI_MERGE_REQUEST_IID
      variables:
        ENVIRONMENT_CLUSTER: "development"
        ENVIRONMENT_NAME: "odw-chat-development"
    - if: $CI_COMMIT_TAG
      # Een tag publiceert alleen chart en GitHub-mirror; playground installeert een release via de promotie-MR
      # (docs/promoten.md) en productie volgt de ladder nog niet (#674).
      variables:
        ENVIRONMENT_CLUSTER: "playground"
        ENVIRONMENT_NAME: "odw-chat-playground"

include:
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/base/base@0.10.10
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/base/security@0.10.10
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/semver/generate-version@1.0.5
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/semver/promote-version@1.0.5
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/docker/docker-lint@1.0.13
    inputs:
      name: docker:docker-lint
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/docker/docker-build@1.0.13
    inputs:
      name: docker:docker-build
      image: $HARBOR_HOST/$HARBOR_PROJECT/$CI_PROJECT_NAME
      build_args: --build-arg GIT_COMMIT=$CI_COMMIT_SHORT_SHA
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/docker/docker-promote@1.0.13
    inputs:
      name: docker:docker-promote
      image: $HARBOR_HOST/$HARBOR_PROJECT/$CI_PROJECT_NAME
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/helm/helm-lint@0.9.15
    inputs:
      dir: $CHART_PATH
  - local: .gitlab/helm-package.yaml
    inputs:
      dir: $CHART_PATH
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/helm/helm-publish@0.9.15
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/helm/helm-promote@0.9.15
    inputs:
      # helm:publish pusht naar .../onderwijsdata-chat en Helm voegt de chartnaam toe;
      # helm:promote pult het exacte pad, dus dat moet die naam zelf bevatten.
      chart: oci://$HARBOR_HOST/$HARBOR_PROJECT/onderwijsdata-chat/onderwijsdata-chat
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/helm/helm-publish@0.9.15
    inputs:
      name: helm:publish-promoted
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/kubernetes/diff@1.0.6
    inputs:
      cluster: ${ENVIRONMENT_CLUSTER}
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/kubernetes/dry-run@1.0.6
    inputs:
      cluster: ${ENVIRONMENT_CLUSTER}
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/kubernetes/verify-up@1.0.6
    inputs:
      cluster: ${ENVIRONMENT_CLUSTER}
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/kubernetes/verify-up@1.0.6
    inputs:
      name: kubernetes:verify-up:tag
      chart_version: $CI_COMMIT_TAG
      cluster: ${ENVIRONMENT_CLUSTER}
  - component: $CI_SERVER_FQDN/surf-internal/sdp/components/kubernetes/failure@1.0.6
    inputs:
      cluster: ${ENVIRONMENT_CLUSTER}

variables:
  # De waarde die de pipeline altijd al gebruikte: een gelijknamige projectvariabele ging voor deze regel. Die
  # projectvariabele verdwijnt (#685), zodat het pad alleen hier staat en niet buiten de review om te wijzigen is.
  CHART_PATH: charts/onderwijsdata-chat
  CI_PROJECT_NAME: onderwijsdata-chat

# Een geplande pipeline (schedule) op main bouwt en rolt niets uit: elke regel op main sluit haar uit, zodat
# alleen bron:ping (met BRON_PING=1) en eval:bronwaarheid (met EVAL_BASE_URL) in zo'n pipeline draaien (#627).
# De SAST- en secret-detectionjobs van de securitycomponent zet het schema zelf uit (SAST_DISABLED=1,
# SECRET_DETECTION_DISABLED=1): hun regels staan in de component.
stages:
  - build
  - test
  - package
  - pre-deploy
  - release
  - post-deploy

version:generate:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
    - if: $CI_MERGE_REQUEST_IID

version:promote:
  rules:
    - if: $CI_COMMIT_TAG

# De test-stage bestond wel maar had geen enkele job: pipelines konden groen zijn
# terwijl de suite rood stond. Draait ook op tags, zodat een release niet te
# taggen is met falende tests.
pytest:
  # .pre so docker:docker-build (stage build, fixed by the SDP component) may wait for it:
  # needs cannot point at a later stage, and moving the build job breaks the component's
  # generate-sbom job (see 3d989ee).
  stage: .pre
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
  needs: []
  image:
    name: python:3.14-slim@sha256:cd89c30eda26ee911a4611b18680086e0ea42e6f5f8cbe653d07fa7958c9cec8
  variables:
    UV_CACHE_DIR: .uv-cache
    # helm voor tests/test_manifests.py: zonder helm sloegen de chart-tests in CI stil over (#768). Versie en checksum
    # horen bij elkaar, Renovate volgt ze niet: pas bij een update beide aan (de checksum staat naast de tarball op
    # get.helm.sh, als helm-<versie>-linux-amd64.tar.gz.sha256sum).
    HELM_VERSION: v3.16.0
    HELM_SHA256: 327cfbc7ddc5a3eb644039ceb0cff66394628654c4f5a76bf715ed15b893983b
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  before_script:
    # git is nodig omdat riodata en onderwijsdata als git-dependency staan in uv.lock; curl voor helm hieronder
    - apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates && rm -rf /var/lib/apt/lists/*
    - pip install --no-cache-dir uv
    # Eén statische binary, gecontroleerd op checksum; geen pakketbron.
    - curl -fsSL --retry 3 -o /tmp/helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
    - echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
    - tar -xzf /tmp/helm.tgz -C /usr/local/bin --strip-components=1 linux-amd64/helm
    - helm version --short
  script:
    # mcp: zonder de extra slaan de protocoltests van tests/test_mcp_server.py over (#41).
    - uv sync --frozen --extra postgres --extra mcp
    # Lint vóór de tests: een dubbele dict-key verborg de NHL Stenden-bug (#202, #203).
    - uv run ruff check .
    - uv run ruff format --check .
    # ty kent geen baseline; het script faalt alleen op diagnostics die nog niet in ty-baseline.txt staan (#230).
    - uv run python scripts/ty_baseline.py
    # Dekking: `fail_under` in pyproject.toml laat deze stap falen onder de ondergrens (#691); `coverage` hieronder
    # zet het totaal op de MR en in de pipeline.
    # -rs: de reden van elke skip staat in het log, zodat een stil overgeslagen test opvalt (#768).
    - uv run pytest tests/ -q -rs --cov --cov-report=term:skip-covered
  coverage: '/^TOTAL.*\s+(\d+(?:\.\d+)?)%/'

# Zelfde image als de frontend-stap in de Dockerfile, zodat Renovate ze samen bijwerkt.
frontend:
  stage: .pre
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
  needs: []
  image:
    name: node:26-alpine@sha256:c6ad9e9c1d80f6eb607c26b4b0a132ff7a2344fad1c78ea3baa2a7d4c8de6d94
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npx eslint src/
    - npx vitest run
    # De eerste load (/login) blijft klein: Plotly en co. horen in de lazy chunks (#110).
    - npm run budget
    # De e2e-evals draaien niet in CI, hun poort en scores wel: zonder app en zonder LLM (CH-28, #36).
    - cd .. && node --test tests/e2e/score-unit.mjs tests/e2e/refusal-unit.mjs tests/e2e/rapport-unit.mjs

# Synthetische controle van de antwoordketen tegen de testomgeving (#169): de bronwaarheid-evals
# (tests/e2e/real-questions.spec.js, ijkwaarden uit #190) als buitenstaander, los van /health en
# /ready. Alleen gepland of met de hand: elke beurt kost een modelaanroep op de testomgeving.
# Vereist de CI-variabelen EVAL_BASE_URL (bijv. https://onderwijsdata-chat.test.sdp.surf.nl),
# EVAL_USERNAME en EVAL_PASSWORD (masked); TEST_MODELS en TEST_REPEATS zijn optioneel.
# Informatief (allow_failure): een rode eval blokkeert geen deploy, het rapport is het signaal.
eval:bronwaarheid:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $EVAL_BASE_URL
    - if: $CI_PIPELINE_SOURCE == "web" && $EVAL_BASE_URL
      when: manual
  needs: []
  allow_failure: true
  image:
    name: node:26-alpine@sha256:c6ad9e9c1d80f6eb607c26b4b0a132ff7a2344fad1c78ea3baa2a7d4c8de6d94
  variables:
    TEST_MODELS: azure_ai/claude-sonnet-5-5
    TEST_REPEATS: "3"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm
  script:
    - npm ci --cache .npm --prefer-offline --ignore-scripts
    # Geen browser nodig: de runner praat via WebSocket met /api/chat; de webServer uit
    # playwright.config.js blijft uit omdat de omgeving al draait. De rapporteval (#752) speelt per
    # scenario een gesprek en vraagt daarna een rapport op: per run twee of drie beurten plus een rapport.
    - npx playwright test real-questions rapport-bijsturing --config=playwright.eval.config.js
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - eval_results/

# Eén aanroep per bron door de toollaag van de chat (CBS, DUO, RIO en de GeoJSON van de kaart), zonder LLM
# en zonder testomgeving (#627): RIO verwijderde API v2 op 19-10-2026 en dat viel pas op in een chatbeurt,
# want pytest mockt de bronnen en /health toetst er geen. Gepland (wekelijks op main; het schema zet
# BRON_PING=1, SAST_DISABLED=1 en SECRET_DETECTION_DISABLED=1) of met de hand via "Run pipeline" met
# BRON_PING=1. Faalt zodra één bron niet antwoordt: de melding van de mislukte geplande pipeline is het signaal.
bron:ping:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $BRON_PING == "1"
    - if: $CI_PIPELINE_SOURCE == "web" && $BRON_PING == "1"
  needs: []
  image:
    name: python:3.14-slim@sha256:cd89c30eda26ee911a4611b18680086e0ea42e6f5f8cbe653d07fa7958c9cec8
  variables:
    UV_CACHE_DIR: .uv-cache
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  before_script:
    # git is nodig omdat riodata en onderwijsdata als git-dependency staan in uv.lock
    - apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
    - pip install --no-cache-dir uv
  script:
    - uv sync --frozen
    - uv run python scripts/bronping.py

# Bekende kwetsbaarheden in de dependencies (#506, SECURITY.md S12): de SDP-securitycomponent
# draait alleen secret detection en SAST, geen dependency-scan. Informatief, zoals de oude
# GitHub-stap: een nieuwe CVE mag een MR die er niets mee te maken heeft niet blokkeren;
# een gele job is het signaal, Renovate stelt de update voor.
audit:python:
  stage: test
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
    - if: $CI_MERGE_REQUEST_IID
  needs: []
  allow_failure: true
  image:
    name: python:3.14-slim@sha256:cd89c30eda26ee911a4611b18680086e0ea42e6f5f8cbe653d07fa7958c9cec8
  before_script:
    - pip install --no-cache-dir uv
  script:
    # De gelockte versies, zonder installatie. riodata en onderwijsdata (git-dependencies van
    # cedanl) staan niet in de PyPI-advisorydatabase en gaan er daarom uit.
    - uv export --frozen --no-dev --no-emit-project --no-hashes --extra postgres -o requirements.txt
    - grep -v " @ git+" requirements.txt > requirements-pypi.txt
    # Bewust genegeerd (SECURITY.md, S12): filelock 3.32.7, fix in 4.2.1, maar litellm (ook 1.106.4) eist filelock<4.0.
    # 112913 en 112907 gelden alleen op Windows; 112940 zit in ReadWriteLock, dat geen pakket hier gebruikt
    # (huggingface_hub gebruikt FileLock/SoftFileLock, litellm alleen in zijn proxy-CLI). Weg zodra filelock>=4.2.1 kan.
    - >-
      uvx pip-audit==2.10.1 -r requirements-pypi.txt --no-deps --disable-pip --progress-spinner off
      --ignore-vuln CVE-2026-112913 --ignore-vuln CVE-2026-112907 --ignore-vuln CVE-2026-112940

audit:npm:
  stage: test
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
    - if: $CI_MERGE_REQUEST_IID
  needs: []
  allow_failure: true
  image:
    name: node:26-alpine@sha256:c6ad9e9c1d80f6eb607c26b4b0a132ff7a2344fad1c78ea3baa2a7d4c8de6d94
  script:
    # Leest alleen package-lock.json en de npm-advisorydatabase; geen npm ci nodig.
    - cd frontend
    - npm audit --audit-level=high

docker:docker-build:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
    - if: $CI_MERGE_REQUEST_IID
  needs:
    - version:generate
    - pytest
    - frontend

# De componentjob heeft eigen regels (main en MR) en needs docker:docker-build: zonder die build, in een
# geplande pipeline, zou de pipeline niet eens starten.
docker:docker-build:generate-sbom:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID

docker:docker-promote:
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - version:promote

helm:lint:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
    - if: $CI_MERGE_REQUEST_IID

helm:package:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
    - if: $CI_MERGE_REQUEST_IID

helm:publish:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
    - if: $CI_MERGE_REQUEST_IID

helm:promote:
  rules:
    - if: $CI_COMMIT_TAG

helm:publish-promoted:
  rules:
    - if: $CI_COMMIT_TAG

kubernetes:diff:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
  needs:
    - job: helm:promote
      optional: true

kubernetes:dry-run:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
    - if: $CI_MERGE_REQUEST_IID

kubernetes:verify-up:
  # Checks that *this* commit is deployed; pointless once a newer one lands.
  interruptible: true
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

# Uit: playground staat vast op een eerdere release en haalt de nieuwe tag pas
# binnen bij een promotie-MR, dus deze job kan tijdens de tag-pipeline niet slagen.
kubernetes:verify-up:tag:
  rules:
    - when: never

# De componentjob rapporteert de namespace als een deploy faalt; een mislukte bron-ping is geen deploy.
kubernetes:failure:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_failure

# De ladder: test houdt de open range, playground pint een bestaande release-tag.
env:promotion-ladder:
  stage: .pre
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
    - if: $CI_MERGE_REQUEST_IID
  needs: []
  image:
    name: python:3.14-slim@sha256:cd89c30eda26ee911a4611b18680086e0ea42e6f5f8cbe653d07fa7958c9cec8
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
    - pip install --no-cache-dir pyyaml
  script:
    - python scripts/promotie.py check

debug:logs:
  stage: .post
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: manual
      allow_failure: true
  environment:
    name: $ENVIRONMENT_NAME
    action: access
  variables:
    KUBERNETES_NAMESPACE: services-onderwijsdata-chat
    CLUSTER: $ENVIRONMENT_CLUSTER
  image: cr.surf.nl/proxy-quay/helmpack/chart-testing:v3.15.0@sha256:54317f2d93730ea9ca1236e3d79cd95d74110b8d733b6ab124e5829209b5f4e4
  script:
    - kubectl config use-context surf-internal/sdp/infrastructure/kubernetes-clusters:${CLUSTER}
    - kubectl get pods -n ${KUBERNETES_NAMESPACE}

sync:github:
  stage: .post
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: always
    - if: $CI_COMMIT_TAG
      when: always
  image:
    name: alpine/git:v2.54.0@sha256:e8ceedc73bd80992ae8d58a7d24c58b8322146c354f1d2e81a97db4452068ec0
    entrypoint: [""]
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    # Een tag-pipeline pusht alleen de tag: HEAD is dan de getagde commit, vaak al ingehaald door main,
    # en die zette GitHub main terug tot de volgende merge (#769).
    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        git push --force "https://x-access-token:${GITHUB_SYNC_TOKEN}@github.com/cedanl/onderwijsdata-chat.git" HEAD:main
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        git push --force "https://x-access-token:${GITHUB_SYNC_TOKEN}@github.com/cedanl/onderwijsdata-chat.git" "refs/tags/$CI_COMMIT_TAG"
      fi
