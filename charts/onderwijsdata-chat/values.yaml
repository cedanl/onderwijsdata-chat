replicaCount: 1

# Deployment rollout strategy. Empty = Kubernetes default (RollingUpdate,
# 25% surge) -- fine for environments with headroom in their ResourceQuota.
# Set to {type: Recreate} per-environment when a quota can't afford the
# transient extra pod a rolling update briefly creates.
strategy: {}

image:
  repository: cr.surf.nl/ceda-onderwijsdata-chat/onderwijsdata-chat
  pullPolicy: Always
  tag: ""

imagePullSecrets:
  - name: sdp-harbor-credentials

nameOverride: ""
fullnameOverride: "fn-onderwijsdata-chat"

podSecurityContext:
  fsGroup: 1000
  runAsGroup: 1000
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsGroup: 1000
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault
  # De app schrijft alleen in /tmp (de werkmappen van run_analysis): die krijgt een emptyDir (tmp hieronder, #675).
  readOnlyRootFilesystem: true

# emptyDir op /tmp voor app en opschoon-CronJob, nodig met readOnlyRootFilesystem. Telt niet mee in limits.ephemeral-storage.
tmp:
  sizeLimit: 1Gi

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

# Probes (#675). Opstarten mag 150 s duren (catalogus en bronnen laden); daarna pas liveness en readiness.
startupProbe:
  httpGet:
    path: /health
    port: 8000
  periodSeconds: 5
  failureThreshold: 30

# /health antwoordt zolang het proces leeft. Een time-out van 5 s en drie missers: een drukke event loop
# (een groot antwoord, een rapport) is geen reden om de pod en elke open chat te herstarten.
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# /ready toetst database en modelsleutel (health.py) en geeft anders 503: zonder database geen verkeer.
readinessProbe:
  httpGet:
    path: /ready
    port: 8000
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Tijd tussen SIGTERM en kill. Uvicorn wacht tot 45 s op lopende HTTP-verzoeken (--timeout-graceful-shutdown in de
# Dockerfile). Een chat-WebSocket sluit uvicorn bij het stoppen meteen met 1012, dus een langere termijn redt geen
# lopend antwoord; dat vraagt een tweede pod of RollingUpdate (#677).
terminationGracePeriodSeconds: 60

service:
  web:
    type: ClusterIP
    port: 80
    targetPort: 8000

ingress:
  web:
    enabled: true
    className: "traefik-external"
    annotations:
      cert-manager.io/cluster-issuer: "harica-eab"
      traefik.ingress.kubernetes.io/router.middlewares: "onderwijsdata-chat-public-allowlist@kubernetescrd"
    hosts:
      - host: onderwijsdata-chat.test.sdp.surf.nl
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: "onderwijsdata-chat-tls"
        hosts:
          - onderwijsdata-chat.test.sdp.surf.nl

autoscaling:
  enabled: false

serviceAccount:
  create: true
  # De app gebruikt de Kubernetes-API niet (#675).
  automount: false
  annotations: {}
  name: ""

env:
  - name: MODEL
    value: "willma/default"
  - name: LOG_LEVEL
    value: "INFO"
  - name: CORS_ORIGINS
    value: "https://onderwijsdata-chat.test.sdp.surf.nl"
  # Geen sleutels: die komen per omgeving uit het SOPS-secret (manifests/<omgeving>/values.yaml). Een nepsleutel
  # hier maakte de modelcheck van /ready betekenisloos (#675).

# Opschoning na de bewaartermijn (#485): een CronJob die `python -m persistence.opschonen` draait, dezelfde code
# als het beheerscript. Standaard uit; aan per omgeving in manifests/<omgeving>/values.yaml. Vraagt POSTGRES_URI in
# `env` (alleen die en BEWAARTERMIJN_* gaan mee, geen andere geheimen): SQLite staat in de pod van de app, daar kan
# een aparte pod niet bij. Termijnen: BEWAARTERMIJN_GESPREKKEN_DAGEN (90) en BEWAARTERMIJN_RAPPORTEN_DAGEN (365),
# in `env` of `opschonen.env`. `droog: true` telt alleen.
opschonen:
  enabled: false
  droog: false
  # Elke nacht om 03:30 Nederlandse tijd.
  schedule: "30 3 * * *"
  timeZone: "Europe/Amsterdam"
  env: []
  # Klein: één transactie met een handvol DELETE's. Telt mee in het ResourceQuota van de namespace.
  resources:
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
